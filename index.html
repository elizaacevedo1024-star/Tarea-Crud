<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CRUD Productos - Fetch + PHP OOP + MySQL</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">

    <h2 class="mb-4 text-center">Gestión de Productos</h2>

    <!-- Formulario Guardar / Modificar -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white" id="tituloForm">Registrar producto</div>
        <div class="card-body">
            <form id="formProducto" novalidate>
                <!-- Acciones: "Guardar" o "Modificar" (lo lee el switch del servidor) -->
                <input type="hidden" name="Accion" id="Accion" value="Guardar">
                <input type="hidden" name="id" id="id" value="">

                <div class="row g-3">
                    <div class="col-md-3">
                        <label for="Codigo" class="form-label">Código</label>
                        <input class="form-control" type="text" name="Codigo" id="Codigo" maxlength="20" required>
                        <div class="invalid-feedback" id="err-Codigo"></div>
                    </div>
                    <div class="col-md-4">
                        <label for="Producto" class="form-label">Producto</label>
                        <input class="form-control" type="text" name="Producto" id="Producto" maxlength="100" required>
                        <div class="invalid-feedback" id="err-Producto"></div>
                    </div>
                    <div class="col-md-2">
                        <label for="Precio" class="form-label">Precio</label>
                        <input class="form-control" type="number" step="0.01" min="0.01" name="Precio" id="Precio" required>
                        <div class="invalid-feedback" id="err-Precio"></div>
                    </div>
                    <div class="col-md-3">
                        <label for="Cantidad" class="form-label">Cantidad</label>
                        <!-- min="1" al guardar; script.js lo cambia a min="0" al editar -->
                        <input class="form-control" type="number" step="1" min="1" name="Cantidad" id="Cantidad" required>
                        <div class="invalid-feedback" id="err-Cantidad"></div>
                    </div>
                </div>

                <div class="mt-3 d-flex gap-2">
                    <button type="submit" class="btn btn-success" id="btnGuardar">Registrar</button>
                    <button type="button" class="btn btn-secondary" id="btnCancelar" style="display:none;">Cancelar edición</button>
                </div>
            </form>

            <!-- Alert de Bootstrap para mensajes en el formulario -->
            <div id="alertaForm" class="alert alert-danger mt-3 d-none" role="alert"></div>
        </div>
    </div>

    <!-- Buscar -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form id="formBuscar" class="row g-2">
                <div class="col-md-9">
                    <input type="text" class="form-control" id="termino" placeholder="Buscar por código o nombre...">
                </div>
                <div class="col-md-3 d-grid d-md-flex gap-2">
                    <button type="submit" class="btn btn-primary">Buscar</button>
                    <button type="button" class="btn btn-outline-secondary" id="btnLimpiarBusqueda">Ver todos</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabla -->
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-striped table-hover mb-0 align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th><th>Código</th><th>Producto</th>
                        <th class="text-end">Precio</th><th class="text-end">Cantidad</th><th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaProductos"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="script.js"></script>
</body>
</html>
